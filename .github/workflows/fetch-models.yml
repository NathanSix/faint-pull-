name: Fetch on-device models
# Downloads the MediaPipe models into the repo so the site serves them itself.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-models.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download models
        run: |
          set -e
          mkdir -p models
          B=https://storage.googleapis.com/mediapipe-models
          curl -fsSL -o models/efficientdet_lite0_int8.tflite $B/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite
          curl -fsSL -o models/efficientdet_lite2_fp16.tflite $B/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite
          curl -fsSL -o models/efficientnet_lite2_fp32.tflite $B/image_classifier/efficientnet_lite2/float32/1/efficientnet_lite2.tflite
          ls -la models
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          git diff --cached --quiet || git commit -m "Add MediaPipe models"
          git push
